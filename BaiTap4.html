<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 4 - Menu ngang</title>
<style>
  ul {
    list-style: none;        /* bỏ dấu chấm đầu dòng */
    margin: 0;
    padding: 0;
    background: #00e5ff;     /* nền xanh ngọc như hình */
  }
  li {
    display: inline-block;   /* gợi ý của đề: xếp li nằm ngang */
    width: 100px;
    text-align: center;
  }
  li a {
    font-family: "Times New Roman", serif;
    font-size: 20px;
    color: blue;             /* link vẫn gạch chân như hình mẫu */
  }
</style>
</head>
<body>
<ul>
  <li><a href="#">TMDT</a></li>
  <li><a href="#">ERP</a></li>
  <li><a href="#">MIS</a></li>
  <li><a href="#">DS</a></li>
</ul>
</body>
</html>
