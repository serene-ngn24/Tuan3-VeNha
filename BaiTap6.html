<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Học web chuẩn</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
  }

  /* Khung chứa: vừa đúng 3 hình 350px + 2 khoảng cách 20px */
  .portfolio {
    width: 1090px;
    margin: 20px auto;
  }

  /* ===== Phần tiêu đề: nền xám nhạt, canh giữa ===== */
  .portfolio h2 {
    margin: 0;
    padding: 30px 0 0;
    background: #f5f5f5;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #222;
  }
  /* gạch ngang ngắn màu xanh ngọc dưới tiêu đề */
  .portfolio h2::after {
    content: "";
    display: block;
    width: 50px;
    height: 2px;
    background: #2a8f8f;
    margin: 12px auto 0;
  }

  /* ===== Thanh tab ===== */
  .list-tab {
    list-style: none;
    margin: 0;
    padding: 20px 0 30px;
    background: #f5f5f5;
    text-align: center;
  }
  .list-tab li {
    display: inline-block;
    margin: 0 8px;
  }
  .list-tab a {
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    color: #444;
  }
  .list-tab li:first-child a,      /* tab "All" đang chọn */
  .list-tab a:hover {
    color: #2a8f8f;
  }

  /* ===== Lưới hình: 3 hình mỗi hàng ===== */
  .galerry {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    font-size: 0;                   /* xoá khoảng trắng giữa các inline-block */
  }
  .galerry li {
    display: inline-block;
    width: 350px;
    height: 260px;
    margin: 0 20px 20px 0;
    background: #99cc77;            /* màu xanh lá giống hình (hiện cả khi ảnh chưa tải) */
  }
  .galerry li:nth-child(3n) {
    margin-right: 0;                /* hình thứ 3 mỗi hàng sát lề phải */
  }
  .galerry a { display: block; }
  .galerry img {
    position: relative;
    display: block;
    width: 350px;
    height: 260px;
  }
  /* Khi ảnh không tải được: hiện alt text "Học Web Chuẩn"
     canh giữa trên nền xanh (che luôn icon ảnh lỗi) */
  .galerry img::after {
    content: attr(alt);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #99cc77;
    color: #fff;
    font-size: 22px;
    font-weight: 300;
  }
  .galerry a:hover img { opacity: 0.8; }
</style>
</head>
<body>
  <section class="portfolio">
    <h2>MY PORTFOLIO</h2>
    <ul class="list-tab">
