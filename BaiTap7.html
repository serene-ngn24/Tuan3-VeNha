<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 7 - Bố cục trang</title>
<style>
  * { box-sizing: border-box; }
  #wrapper {
    width: 400px;
    margin: 30px auto;
    padding: 8px;
    border: 3px solid #000;
    position: relative;
  }
  #wrapper::before { content: "wrapper"; position: absolute; top: -22px; left: 0; }
  header, nav, main, footer {
    border: 2px solid #000;
    padding: 4px;
  }
  header { height: 40px; margin-bottom: 6px; }
  nav  { float: left;  width: 25%; height: 230px; }
  main { float: right; width: 73%; height: 230px; }
  footer { clear: both; height: 28px; position: relative; top: 6px; margin-bottom: 6px; }
  header::before { content: "header"; }
  nav::before    { content: "nav"; }
  main::before   { content: "main"; }
  footer::before { content: "footer"; }
</style>
</head>
<body>
  <div id="wrapper">
    <header></header>
    <nav></nav>
    <main></main>
    <footer></footer>
  </div>
</body>
</html>
