<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khoa CNTTKD</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; }
  .best-shared {
    text-align: center;          /* gợi ý i: canh giữa toàn bộ */
    background: #f7f7f7;
    padding: 30px 20px;
  }
  .best-shared h2 {
    font-size: 48px;
    font-weight: normal;
    color: #333;
    margin: 10px 0;
  }
  .best-shared h2 strong {
    color: #1ea7f2;              /* chữ "Shared Hosting" màu xanh */
    font-weight: normal;
  }
  .lead-text { color: #555; font-size: 14px; }
  .btn-list { list-style: none; padding: 0; margin-top: 30px; }
  .btn-list li {
    display: inline-block;       /* gợi ý iii: 2 nút nằm ngang */
    margin: 0 10px;
  }
  .btn-list a {
    display: inline-block;
    padding: 12px 40px;
    background: #222;
    color: #fff;
    text-decoration: none;       /* gợi ý ii: bỏ gạch chân */
    border-radius: 3px;
    font-size: 14px;
  }
  .btn-list a:hover { background: #1ea7f2; }
</style>
</head>
<body>
  <section class="best-shared">
    <p class="logo"><img style="width:200px" src="https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png" alt=""></p>
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>
</body>
</html>
