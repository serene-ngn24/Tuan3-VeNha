<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 2 - Định dạng đoạn văn</title>
<style>
  /* d. Logo BIT làm hình nền: 30px, lặp lại, cố định khi cuộn */
  body {
    background-image: url("https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png");
    background-size: 30px;
    background-repeat: repeat;
    background-attachment: fixed;
  }
  /* a. Đại học UEH */
  .ueh {
    color: blue;
    text-align: center;
    font-weight: bold;
    text-decoration: underline;
    font-size: 30px;
  }
  /* b. Khoa CNTTKD */
  .cnttkd {
    color: red;
    text-align: right;
    font-style: italic;
    border: 2px dotted yellow;
    border-radius: 10px;
    background-color: gray;
    font-size: 15px;
    opacity: 0.5;
  }
  /* c. BIT-UEH: chữ vàng + bóng chữ (tạo bằng text-shadow generator) */
  .bit {
    color: #A7DD3C;
    background: #FFFFFF;
    text-shadow: 2px 0 0px #800040, 3px 2px 0px rgba(77,0,38,0.5), 3px 0 3px #FF002B, 5px 0 3px #800015, 6px 2px 3px rgba(77,0,13,0.5), 6px 0 9px #FF5500, 8px 0 9px #802A00, 9px 2px 9px rgba(77,25,0,0.5), 9px 0 18px #FFD500, 11px 0 18px #806A00, 12px 2px 18px rgba(77,66,0,0.5), 12px 0 30px #D4FF00, 14px 0 30px #6A8000, 15px 2px 30px rgba(64,77,0,0.5), 15px 0 45px #80FF00, 17px 0 45px #408000, 17px 2px 45px rgba(38,77,0,0.5);
  }
  /* e. Đoạn văn bị tràn */
  .tran {
    width: 100px;
    height: 50px;
    overflow: hidden;         /* i. ẩn nội dung tràn */
    text-overflow: ellipsis;  /* ii. thêm dấu ... */
    white-space: nowrap;      /* iii. không xuống dòng */
    background: #fff;
  }
</style>
</head>
<body>
  <p class="ueh">Đại học UEH</p>
  <p class="cnttkd">Khoa CNTTKD</p>
  <p class="bit">BIT-UEH</p>
  <p class="tran">Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều</p>
</body>
</html>
